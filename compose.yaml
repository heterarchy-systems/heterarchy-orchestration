name: chattocodex

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHATTOCODEX_POSTGRES_DB:-chattocodex}
      POSTGRES_USER: ${CHATTOCODEX_POSTGRES_USER:-chattocodex}
      POSTGRES_PASSWORD: ${CHATTOCODEX_POSTGRES_PASSWORD:-chattocodex-local}
    ports:
      - "127.0.0.1:${CHATTOCODEX_POSTGRES_PORT:-55432}:5432"
    volumes:
      - chattocodex-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  chattocodex-postgres:

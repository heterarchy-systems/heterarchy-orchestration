name: heterarchy-orchestration

services:
  orchestration:
    image: ghcr.io/heterarchy-systems/heterarchy-orchestration:${ORCHESTRATION_VERSION:-0.1.0}
    network_mode: host
    user: "10001:10001"
    init: true
    read_only: true
    environment:
      - HETERARCHY_ORCHESTRATION_OPERATOR_PRINCIPALS
    volumes:
      - orchestration-state:/state
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: "no"

volumes:
  orchestration-state:

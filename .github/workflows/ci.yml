name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust harness
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out Orchestration repository
        uses: actions/checkout@v4
        with:
          path: heterarchy-orchestration
          fetch-depth: 1
          persist-credentials: false

      - name: Check out Forge source
        uses: actions/checkout@v4
        with:
          repository: heterarchy-systems/heterarchy-forge
          ref: main
          path: heterarchy-forge
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Check out Broker source
        uses: actions/checkout@v4
        with:
          repository: heterarchy-systems/heterarchy-broker
          ref: main
          path: heterarchy-broker
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Select runner-local Rust storage
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/heterarchy-orchestration-target" "${RUNNER_TEMP}/heterarchy-orchestration-tmp"
          printf 'CARGO_TARGET_DIR=%s/heterarchy-orchestration-target\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'TMPDIR=%s/heterarchy-orchestration-tmp\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'CARGO_BUILD_JOBS=2\n' >> "${GITHUB_ENV}"
          printf 'CARGO_INCREMENTAL=0\n' >> "${GITHUB_ENV}"

      - name: Install pinned Rust toolchain
        working-directory: heterarchy-orchestration
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt

      - name: Build Broker daemon for real cluster tests
        working-directory: heterarchy-broker
        run: |
          cargo +1.98.0 build --locked --bin agentbrokerd
          printf 'AGENT_BROKERD_BIN=%s/heterarchy-orchestration-target/debug/agentbrokerd\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Run canonical CI harness
        working-directory: heterarchy-orchestration
        run: make ci


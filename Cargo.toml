[workspace]
members = [
    ".agents/rust_dev_harness/harness/xtask",
    "crates/heterarchy-orchestration-policy",
    "crates/heterarchy-orchestration-auth",
    "crates/heterarchy-orchestration-sessions",
    "crates/heterarchy-orchestration-packager",
    "crates/heterarchy-orchestration-operations",
    "crates/heterarchy-orchestration-runtime",
    "crates/heterarchy-orchestration-backend",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
security-framework = { version = "=3.7.0", default-features = false }
sha2 = "=0.10.9"
toml = "=0.9.12"
heterarchy-orchestration-policy = { version = "=0.1.0" }
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }

axum = { version = "=0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
getrandom = { version = "=0.4.3", default-features = false }
serde_json = "=1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
uuid = { version = "=1.25.0", features = ["v7"] }

[patch.crates-io]
heterarchy-orchestration-policy = { path = "crates/heterarchy-orchestration-policy" }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
